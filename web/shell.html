<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenGD</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }  /* display:flex on #setup would otherwise beat the hidden attribute */
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; outline: none; touch-action: none; }
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b1630; z-index: 2; }
  #setup .box { max-width: 460px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  button, label.btn { display: inline-block; margin: 8px 4px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #2f7bff; color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #33405f; }
  button:disabled { opacity: .5; cursor: default; }
  small { color: #9ab; display: block; margin-top: 12px; }
  #status { min-height: 1.4em; margin: 8px 0; color: #9cf; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="setup"><div class="box">
  <h1>OpenGD</h1>
  <p>Open-source C++ / SDL2 reimplementation of Geometry&nbsp;Dash&nbsp;1.0.<br>
     Game assets are <b>not</b> included.</p>
  <div id="status">Loading engine…</div>
  <div id="pick" hidden>
    <label class="btn">Choose Resources.akrile / Geometry Dash APK
      <input id="file" type="file" accept=".akrile,.apk,.zip">
    </label>
    <small>Loaded and unpacked in your browser, then stored locally (IndexedDB). Nothing is uploaded.</small>
  </div>
  <div id="ready" hidden>
    <button id="start">Start</button>
    <button id="reset" class="secondary">Remove stored assets</button>
  </div>
</div></div>
<div id="game"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>

<script src="akrile.js"></script>
<script>
const $ = id => document.getElementById(id);
const EXT = /\.(png|plist|fnt|mp3|ogg|wav|ttf|json|txt)$/i;
let fsx;  // NB: not 'FS' - Emscripten declares a global FS and a clash kills index.js

function setStatus(t) { $('status').textContent = t; }
function findFile(dir, re) {
  let names;
  try { names = fsx.readdir(dir); } catch (e) { return false; }
  for (const n of names) {
    if (n === '.' || n === '..') continue;
    const p = dir + '/' + n;
    let st; try { st = fsx.stat(p); } catch (e) { continue; }
    if (fsx.isDir(st.mode) ? findFile(p, re) : re.test(n)) return true;
  }
  return false;
}
function hasAssets() { return findFile('/Resources', /^GJ_LaunchSheet(-hd)?\.plist$/); }
function sync(populate) { return new Promise(res => fsx.syncfs(populate, err => { if (err) console.warn(err); res(); })); }
function show() {
  const ok = hasAssets();
  $('pick').hidden = ok; $('ready').hidden = !ok;
  setStatus(ok ? 'Assets found.' : 'No game assets yet.');
}
const tick = () => new Promise(r => setTimeout(r, 0));   // let the UI repaint between files

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('cannot load ' + src)); document.head.appendChild(s); });
}

// Normalise an archive entry name to a path below /Resources, or null to skip it.
function targetName(name) {
  let rel = name.replace(/\\/g, '/');
  const a = rel.lastIndexOf('assets/'), r = rel.lastIndexOf('Resources/');
  if (a >= 0) rel = rel.slice(a + 7); else if (r >= 0) rel = rel.slice(r + 10);
  if (rel.startsWith('res/') || rel.startsWith('lib/') || rel.startsWith('/') || rel.split('/').includes('..')) return null;
  return EXT.test(rel) ? rel : null;
}

// entries: [{name, bytes: async () => Uint8Array}]
async function writeEntries(entries, label) {
  let n = 0;
  for (const e of entries) {
    const rel = targetName(e.name);
    if (!rel) continue;
    const path = '/Resources/' + rel;
    fsx.mkdirTree(path.slice(0, path.lastIndexOf('/')));
    fsx.writeFile(path, await e.bytes());
    if (++n % 10 === 0) { setStatus(label + ': ' + n + ' / ' + entries.length + ' files…'); await tick(); }
  }
  setStatus('Saving…');
  await sync(false);
  show();
  if (!hasAssets()) setStatus('No Geometry Dash assets found in this file (GJ_LaunchSheet.plist is missing).');
}

async function importAkrile(u8) {
  if (typeof Akrile === 'undefined') throw new Error('akrile.js is missing next to index.html');
  await Akrile.ready;
  const z = await Akrile.loadAsync(u8);
  const entries = Object.keys(z.files).filter(n => !n.endsWith('/')).map(n => ({ name: n, bytes: () => z.file(n).async('uint8array') }));
  await writeEntries(entries, 'Unpacking');
}

async function importZip(u8) {
  if (typeof JSZip === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const z = await JSZip.loadAsync(u8);
  const entries = Object.values(z.files).filter(f => !f.dir).map(f => ({ name: f.name, bytes: () => f.async('uint8array') }));
  await writeEntries(entries, 'Unpacking');
}

// Sniff the format by magic bytes, not by file name.
async function importBytes(u8) {
  const m = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
  if (m === 'AKRL') return importAkrile(u8);
  if (m.startsWith('PK')) return importZip(u8);
  throw new Error('unknown file format (expected .akrile, .apk or .zip)');
}

// Optional: a Resources.akrile deployed next to the page (private deployments) is picked up automatically.
async function tryAutoFetch() {
  try {
    setStatus('Looking for Resources.akrile…');
    const r = await fetch('Resources.akrile', { cache: 'no-cache' });
    if (!r.ok) return false;
    setStatus('Downloading Resources.akrile…');
    const u8 = new Uint8Array(await r.arrayBuffer());
    if (String.fromCharCode(u8[0], u8[1], u8[2], u8[3]) !== 'AKRL') return false;  // e.g. an SPA fallback page
    await importAkrile(u8);
    return true;
  } catch (e) { console.warn('auto-fetch failed:', e); return false; }
}

function wipe(dir) {
  for (const n of fsx.readdir(dir)) {
    if (n === '.' || n === '..') continue;
    const p = dir + '/' + n;
    if (fsx.isDir(fsx.stat(p).mode)) { wipe(p); fsx.rmdir(p); } else fsx.unlink(p);
  }
}

var Module = {
  noInitialRun: true,
  canvas: document.getElementById('canvas'),
  print: t => console.log(t),
  printErr: t => console.warn(t),
  onRuntimeInitialized: async function () {
    fsx = Module.FS;
    fsx.mkdir('/Resources'); fsx.mkdir('/save');
    fsx.mount(fsx.filesystems.IDBFS, {}, '/Resources');
    fsx.mount(fsx.filesystems.IDBFS, {}, '/save');
    await sync(true);
    if (!hasAssets()) await tryAutoFetch();
    show();
  }
};

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { setStatus('Reading ' + f.name + '…'); await importBytes(new Uint8Array(await f.arrayBuffer())); }
  catch (err) { setStatus('Import failed: ' + err.message); }
  e.target.value = '';
});
$('reset').addEventListener('click', async () => { wipe('/Resources'); await sync(false); show(); });
$('start').addEventListener('click', () => {
  $('setup').hidden = true;      // the click is the user gesture that unlocks audio
  $('canvas').focus();
  Module.callMain([]);
});
</script>
{{{ SCRIPT }}}
</body>
</html>
