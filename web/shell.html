<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenGD</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; outline: none; touch-action: none; }
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b1630; z-index: 2; }
  #setup .box { max-width: 460px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  button, label.btn { display: inline-block; margin: 8px 4px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #2f7bff; color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #33405f; }
  button:disabled { opacity: .5; cursor: default; }
  small { color: #9ab; display: block; margin-top: 12px; }
  #status { min-height: 1.4em; margin: 8px 0; color: #9cf; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="setup"><div class="box">
  <h1>OpenGD</h1>
  <p>Open-source C++ / SDL2 reimplementation of Geometry&nbsp;Dash&nbsp;1.0.<br>
     Game assets are <b>not</b> included.</p>
  <div id="status">Loading engine…</div>
  <div id="pick" hidden>
    <label class="btn">Choose Geometry Dash APK / ZIP
      <input id="file" type="file" accept=".apk,.zip">
    </label>
    <small>The file is unpacked in your browser and stored locally (IndexedDB). Nothing is uploaded.</small>
  </div>
  <div id="ready" hidden>
    <button id="start">Start</button>
    <button id="reset" class="secondary">Remove stored assets</button>
  </div>
</div></div>
<div id="game"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const EXT = /\.(png|plist|fnt|mp3|ogg|wav|ttf|json)$/i;
let FS;

function setStatus(t) { $('status').textContent = t; }
function hasAssets() {
  try { return FS.readdir('/Resources').some(n => /^GJ_LaunchSheet(-hd)?\.plist$/.test(n) || FS.isDir(FS.stat('/Resources/' + n).mode)); }
  catch (e) { return false; }
}
function sync(populate) { return new Promise(res => FS.syncfs(populate, err => { if (err) console.warn(err); res(); })); }
function show() {
  const ok = hasAssets();
  $('pick').hidden = ok; $('ready').hidden = !ok;
  setStatus(ok ? 'Assets found.' : 'No game assets yet.');
}

async function importArchive(file) {
  setStatus('Reading ' + file.name + '…');
  const zip = await JSZip.loadAsync(file);
  const entries = Object.values(zip.files).filter(f => !f.dir && EXT.test(f.name));
  let n = 0;
  for (const f of entries) {
    // APK: "assets/<file>" ; already-prepared zips: "Resources/<file>" or plain files
    let rel = f.name;
    const a = rel.lastIndexOf('assets/'), r = rel.lastIndexOf('Resources/');
    if (a >= 0) rel = rel.slice(a + 7); else if (r >= 0) rel = rel.slice(r + 10);
    if (rel.startsWith('res/') || rel.startsWith('lib/')) continue;
    const path = '/Resources/' + rel;
    FS.mkdirTree(path.slice(0, path.lastIndexOf('/')));
    FS.writeFile(path, await f.async('uint8array'));
    if (++n % 50 === 0) setStatus('Unpacked ' + n + ' / ' + entries.length + ' files…');
  }
  setStatus('Saving…');
  await sync(false);
  show();
  if (!hasAssets()) setStatus('This archive does not contain Geometry Dash assets (GJ_LaunchSheet.plist not found).');
}

function wipe(dir) {
  for (const n of FS.readdir(dir)) {
    if (n === '.' || n === '..') continue;
    const p = dir + '/' + n;
    if (FS.isDir(FS.stat(p).mode)) { wipe(p); FS.rmdir(p); } else FS.unlink(p);
  }
}

var Module = {
  noInitialRun: true,
  canvas: document.getElementById('canvas'),
  print: t => console.log(t),
  printErr: t => console.warn(t),
  onRuntimeInitialized: async function () {
    FS = Module.FS;
    FS.mkdir('/Resources'); FS.mkdir('/save');
    FS.mount(FS.filesystems.IDBFS, {}, '/Resources');
    FS.mount(FS.filesystems.IDBFS, {}, '/save');
    await sync(true);
    show();
  }
};

$('file').addEventListener('change', e => { if (e.target.files[0]) importArchive(e.target.files[0]).catch(err => setStatus('Import failed: ' + err.message)); });
$('reset').addEventListener('click', async () => { wipe('/Resources'); await sync(false); show(); });
$('start').addEventListener('click', () => {
  $('setup').hidden = true;      // the click is the user gesture that unlocks audio
  $('canvas').focus();
  Module.callMain([]);
});
</script>
{{{ SCRIPT }}}
</body>
</html>
